# Reglas del bus de eventos (v0). Se cargan al arrancar: `ev servir --reglas D:\dev\eventos\reglas.toml`.
# Límites: profundidad (cuántos agentes encadenados como máximo), por_hora, a_la_vez y max_agentes (global).
# La v0 solo lanza agentes de lectura (claude --restricted con --tools Read,Grep,Glob: sin Bash ni edición; solo el MCP del bus).

max_agentes = 1

[[regla]]
nombre = "diagnosticar-pruebas-rotas"
tipo = "proceso.fin"
fuente = "proc:cargo test*"
arnes = "claude"
modelo = "sonnet"
permisos = "lectura"
directorio = 'D:\dev\eventos\ejemplos\roto'
encargo = """
Unas pruebas de Rust acaban de fallar. Busca en el bus sus líneas (misma correlación), lee el código si hace falta \
y explica en tres frases como máximo qué falla y por qué. Publica el resultado con publicar, tipo «diagnostico»."""
por_hora = 4
profundidad = 1
minutos = 5

[regla.atributos_distinto]
codigo = 0

# Opción D, primera porción: una puerta de La Fábrica que falla en la última pasada de una tarea despierta a un agente
# de lectura que deja una nota para retomarla. El puente está en D:\dev\Fabrica\src-tauri\src\bus.rs. El agente solo
# puede leer dentro de su directorio (--restricted): los proyectos de La Fábrica viven en F:\La fabrica.
[[regla]]
nombre = "diagnosticar-puerta-fabrica"
tipo = "fabrica.puerta.fallo"
arnes = "claude"
modelo = "sonnet"
permisos = "lectura"
directorio = 'F:\La fabrica'
encargo = """
Una puerta de calidad de La Fábrica ha fallado en la última pasada de una tarea. Busca en el bus los eventos de su \
misma correlación (el inicio y el final de la tarea) y, si hace falta, lee el código del proyecto: su carpeta va en el \
atributo «proyecto_dir». Escribe una nota para retomar la tarea en cuatro frases como máximo: qué falla, por qué, qué \
cambió y la siguiente orden concreta. Publícala con publicar, tipo «nota.reanudacion»."""
por_hora = 6
profundidad = 1
minutos = 5

# Quórum (D:\dev\quorum): una tarea rechazada o con error despierta al mismo agente de lectura. Las reglas casan valores
# exactos, así que van dos, una por estado. Quórum se lanza sobre proyectos de D:\dev y deja el worktree de una tarea sin
# integrar en .quorum\<proyecto>\<tarea>\arbol, junto a la carpeta del repositorio: los dos quedan dentro del directorio.
[[regla]]
nombre = "diagnosticar-quorum-rechazada"
tipo = "quorum.tarea.fin"
arnes = "claude"
modelo = "sonnet"
permisos = "lectura"
directorio = 'D:\dev'
encargo = """
Una tarea de Quórum ha terminado rechazada: los revisores no la aprobaron. Busca en el bus los eventos de su misma \
correlación: el inicio (la tarea pedida y la rama), cada puerta (la salida de las pruebas) y cada voto (las objeciones \
de los revisores). Si hace falta, lee el código: el repositorio va en el atributo «proyecto_dir» y el worktree de la \
tarea queda en .quorum\\<proyecto>\\<tarea>\\arbol, junto a la carpeta del repositorio. Escribe una nota para retomar \
la tarea en cuatro frases como máximo: qué se pedía, qué objeción o qué prueba la tumbó, qué falta y la siguiente orden \
concreta. Publícala con publicar, tipo «nota.reanudacion»."""
por_hora = 4
profundidad = 1
minutos = 5

[regla.atributos]
estado = "rechazada"

[[regla]]
nombre = "diagnosticar-quorum-error"
tipo = "quorum.tarea.fin"
arnes = "claude"
modelo = "sonnet"
permisos = "lectura"
directorio = 'D:\dev'
encargo = """
Una tarea de Quórum ha terminado con error: se cortó antes de que los revisores decidieran. Busca en el bus los eventos \
de su misma correlación: el inicio (la tarea pedida y la rama), las puertas y los votos que llegaran, y el final, cuyo \
cuerpo trae el error. Si hace falta, lee el código: el repositorio va en el atributo «proyecto_dir» y el worktree de la \
tarea queda en .quorum\\<proyecto>\\<tarea>\\arbol, junto a la carpeta del repositorio. Escribe una nota para retomar \
la tarea en cuatro frases como máximo: qué se pedía, dónde se cortó, por qué y la siguiente orden concreta. Publícala \
con publicar, tipo «nota.reanudacion»."""
por_hora = 4
profundidad = 1
minutos = 5

[regla.atributos]
estado = "error"
