[package]
name = "eventos"
version = "0.1.0"
edition = "2021"
description = "Bus de eventos universal: recoge la salida de cualquier cosa y despierta agentes (Claude Code y otros) según reglas"

[lib]
name = "eventos"
path = "src/lib.rs"

[[bin]]
name = "ev"
path = "src/main.rs"

[dependencies]
notify = "6.1.1"
regex = "1.13.0"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tiny_http = "0.12.0"
toml = "0.8.23"
ulid = "1.2.1"
ureq = { version = "2.12.1", default-features = false, features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_EventLog",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }

[[example]]
# Doble de prueba de los enganches: una ventana que se abre, cambia de título, se cuelga o se cae a propósito.
name = "doble_enganche"
path = "ejemplos/doble_enganche.rs"

[profile.release]
codegen-units = 4
